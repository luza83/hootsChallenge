<!DOCTYPE html>
<html lang="en">
<head>
		<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>{% block title %}Hoot's Challenge{% endblock %}</title>
		<link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/hoot.png') }}">

	<!-- CSS -->
	<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>
	<nav id="nav" aria-label="Main navigation">
		<input class="nav-toggle" type="checkbox" id="nav-toggle">
		<label class="nav-toggle-label" for="nav-toggle" aria-label="Toggle navigation">
			<span aria-hidden="true"></span>
			<span aria-hidden="true"></span>
			<span aria-hidden="true"></span>
		</label>
		<ul>
			<li>
				<a href="{{ url_for('main.index') }}">
					<i class="fa fa-home" title="Home"></i>
					Home
				</a>
			</li>
			<li>
				<a href="{{ url_for('main.about') }}">
					<i class="fa fa-info-circle" title="About"></i>
					About
				</a>
			</li>
			<li>
				<a href="{{ url_for('main.profile') }}">
					<i class="fa fa-user-circle" title="Profile"></i>
					Profile
				</a>
			</li>
			<li>
				<a href="{{ url_for('main.logout') }}">
					<i class="fa fa-sign-out" title="Log Out"></i>
					Log Out
				</a>
			</li>
		</ul>	
	</nav>

	<div class="content">
		{% block content %}{% endblock %}
	</div>
</body>
</html>
